<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="author" content="Luc Thien Phong">

    <title>Vũ trụ của những lời chúc · Birthday Universe – Aurora Flow</title>
</head>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { background:#080713; touch-action:none; font-family: "Segoe UI", Arial, sans-serif; }
    #sky { position:fixed; inset:0; z-index:0; pointer-events:none; background:
        radial-gradient(ellipse at 17% 72%, rgba(49,30,100,.30), transparent 53%),
        radial-gradient(ellipse at 80% 24%, rgba(87,27,79,.29), transparent 48%),
        radial-gradient(ellipse at 52% 47%, #160e32 0%, #0c091d 42%, #05050f 82%); }
    #sky canvas { width:100%; height:100%; display:block; }
    .universe-canvas { position:fixed; inset:0; z-index:1; display:block; touch-action:none; }
    #vignette { position:fixed; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at 50% 48%, transparent 40%, rgba(4,3,14,.13) 72%, rgba(4,3,14,.65) 100%); }
    #greeting { position:fixed; inset: max(24px, env(safe-area-inset-top)) 16px auto; z-index:3; pointer-events:none; text-align:center; color:#fff3fa; text-shadow:0 2px 16px #170c28, 0 0 30px #b97baf55; }
    #greeting .eyebrow { font-size:10px; font-weight:500; letter-spacing:.32em; color:#f1c9ba; margin:0 0 10px; }
    #greeting h1 { font-family:Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(26px, 4.6vw, 58px); line-height:1.16; letter-spacing:-.025em; margin:0; }
    #greeting .subtitle { font-size:clamp(11px,1.4vw,14px); color:#ead7ed; letter-spacing:.025em; margin:10px 0 0; }
    #greeting .ornament { display:flex; justify-content:center; align-items:center; gap:10px; color:#f3d2b4; margin:12px auto 0; font-size:12px; }
    #greeting .ornament::before, #greeting .ornament::after { content:''; width:42px; height:1px; background:linear-gradient(90deg,transparent,#e4b6b9a0); }
    #greeting .ornament::after { transform:rotate(180deg); }
    #hint { position:fixed; bottom:max(18px, env(safe-area-inset-bottom)); left:0; right:0; z-index:3; text-align:center; pointer-events:none; color:#e8cee8b8; font-size:11px; letter-spacing:.09em; text-shadow:0 1px 8px #080713; }
    #hint .desktop { display:inline; } #hint .mobile { display:none; }
    @media (pointer:coarse) { #hint .desktop { display:none; } #hint .mobile { display:inline; } }
    @media (max-height:500px) { #greeting { top:10px; } #greeting .subtitle, #greeting .ornament {display:none;} }
    #boot-status { position:fixed; inset:0; z-index:5; display:grid; place-content:center; padding:24px; text-align:center; color:#ffe4f7; font:16px/1.6 "Segoe UI",Arial,sans-serif; background:#080713; white-space:pre-wrap; }
    #boot-status[hidden] {display:none;}
    body:not(.ready) #greeting, body:not(.ready) #hint {visibility:hidden;}

    /* Lớp ánh sáng điện ảnh: nằm sau WebGL, không cản thao tác vuốt. */
    #aurora { position:fixed; inset:-25%; z-index:0; pointer-events:none; overflow:hidden; opacity:.74; background:radial-gradient(ellipse at 22% 44%,#36287954 0%,transparent 41%),radial-gradient(ellipse at 75% 59%,#a84c7e35 0%,transparent 38%),radial-gradient(ellipse at 52% 24%,#405b9140 0%,transparent 35%); filter:blur(34px); animation:nebula-drift 24s ease-in-out infinite alternate; }
    @keyframes nebula-drift { from {transform:translate(-2%,1%) rotate(-7deg) scale(1);} to {transform:translate(3%,-2%) rotate(7deg) scale(1.13);} }
    #meteors { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .meteor { position:absolute; left:var(--x); top:var(--y); width:clamp(75px,14vw,220px); height:1.5px; opacity:0; transform-origin:right center; background:linear-gradient(90deg,transparent,#c8c7ff55,#fff5e6); border-radius:99px; filter:drop-shadow(0 0 4px #c8b7ff); animation:meteor-flight var(--period) linear infinite; animation-delay:var(--delay); }
    .meteor::after {content:'';position:absolute;right:0;top:-1.5px;width:4px;height:4px;border-radius:50%;background:#fff5ed;box-shadow:0 0 12px 3px #e2cbff;}
    @keyframes meteor-flight {0%,73%{opacity:0;transform:translate(-25vw,-16vh) rotate(28deg);} 75%{opacity:.85;} 87%{opacity:.55;} 91%,100%{opacity:0;transform:translate(55vw,35vh) rotate(28deg);}}
    #greeting { inset:max(30px, env(safe-area-inset-top)) 16px auto; }
    #greeting h1 { color:#fff0e9; text-shadow:0 0 23px #e5a1c348,0 2px 24px #090511; font-size:clamp(29px,5vw,64px); letter-spacing:-.035em; }
    #greeting .subtitle { line-height:1.6; max-width:34em; margin:12px auto 0; color:#f2d9e9; }
    #greeting .eyebrow { color:#eac3a6; letter-spacing:.27em; }
    body.ready #greeting {animation:greeting-in 1.8s cubic-bezier(.2,.7,.2,1) both;}
    body.ready .universe-canvas {animation:universe-in 2.3s ease-out both;}
    @keyframes greeting-in {from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes universe-in {from{opacity:0;filter:brightness(.65)}to{opacity:1;filter:brightness(1)}}
    @media(max-width:480px){#greeting{top:24px;}}
    @media(prefers-reduced-motion:reduce){#aurora,.meteor,body.ready #greeting,body.ready .universe-canvas{animation:none!important;}}
    #birthday-audio {display:none!important;}

    <audio id="birthday-audio" autoplay loop preload="auto" playsinline hidden></audio>
    <div id="boot-status" role="status">Đang tải vũ trụ…</div>
    <script>

    // ==================== NHẠC NỀN + BEAT TRỰC TIẾP ====================
    const musicHost = /^(www\.)?vuaphimvip\.online$/i.test(location.hostname) && /^https?:$/.test(location.protocol)
        ? location.origin : 'https://vuaphimvip.online';
    const musicURL = musicHost + '/' + encodeURIComponent('nhạc.mp3');
    let audio = document.getElementById('birthday-audio');
    const beatConfig = {
        particleIntensity: 1.65, bassSensitivity: 1.65, heartWidth: 1.30,
        heartHeight: 0.81, heartGap: 0.015, heartFPS: 30,
        minBeatGap: 350, // Giới hạn xung mạnh, chỉ một nhóm hạt sáng lên.
        flashAttack: 55, flashHold: 35, flashRelease: 240, // ms; chuyển sáng mềm
        starSize: 1.0, baseBrightness: 0.82,
        flowIntensity: 1.15, flowSpeed: 1.35, rippleSpeed: 43, rippleWidth: 5.5
    };
    const beatState = {bass:0, treble:0, pulse:0, lastBeat:-Infinity, radius:0, wave:0, flow:0, phase:0};
    // Ba xung có thể cùng lan tỏa; nhịp mới không cắt mất đuôi sáng nhịp trước.
    const rippleHistory = [];
    const rippleRadii = new Float32Array(3), ripplePowers = new Float32Array(3);
    const ease01 = x => {x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
    function updateLightEnvelope(now, dt, active) {
        let pulse=0;
        rippleRadii.fill(0); ripplePowers.fill(0);
        if (!active) rippleHistory.length=0;
        while(rippleHistory.length && now-rippleHistory[0].at>1250) rippleHistory.shift();
        for(let i=0;i<rippleHistory.length;i++) {
            const hit=rippleHistory[i], age=Math.max(0,now-hit.at);
            const attack=ease01(age/beatConfig.flashAttack);
            const release=1-ease01((age-beatConfig.flashAttack-beatConfig.flashHold)/beatConfig.flashRelease);
            pulse=Math.max(pulse,hit.power*attack*release);
            rippleRadii[i]=Math.min(55,age*.001*beatConfig.rippleSpeed);
            ripplePowers[i]=hit.power*ease01(age/65)*(1-ease01(age/1250));
        }
        // Làm mượt độc lập FPS, kể cả khi chạy trên điện thoại.
        beatState.pulse+=(pulse-beatState.pulse)*(1-Math.exp(-dt*(pulse>beatState.pulse?35:18)));
        const target=active?Math.min(1,.70*beatState.bass+.30*beatState.treble):0;
        beatState.flow+=(target-beatState.flow)*(1-Math.exp(-dt*7));
        if(active) beatState.phase=(beatState.phase+dt*beatConfig.flowSpeed*(.35+1.2*beatState.flow))%(Math.PI*2);
        const n=rippleHistory.length;
        beatState.radius=n?rippleRadii[n-1]:0;
        beatState.wave=n?ripplePowers[n-1]:0;
    }
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const AC = window.AudioContext || window.webkitAudioContext;
    let context=null, analyser=null, source=null, liveFloats=null, liveDisabled=false;
    let playPending=false, graphWatch=0, liveSilentSince=0, activeMode='none';
    let reportedBeat=false;
    function status(mode) {
        if (activeMode !== mode) { activeMode=mode; console.info('[Beat] nguồn:',mode); }
    }
    function configureAudio(target) {
        target.volume=.48; target.muted=false; target.loop=true; target.autoplay=true;
        target.addEventListener('playing',()=>{ if(target===audio) unlockAudio(); });
        target.addEventListener('canplay',()=>{ if(target===audio) tryMusic(); });
        target.addEventListener('error',()=>console.warn('[Beat] lỗi MP3:',target.currentSrc,target.error));
        target.src=musicURL;
    }
    function tryMusic() {
        if (!audio.paused || audio.error || playPending) return;
        const target=audio; playPending=true;
        Promise.resolve(target.play()).catch(e=>{
            if(e.name!=='NotAllowedError' && e.name!=='AbortError') console.warn('MP3:',e);
        }).finally(()=>{if(target===audio)playPending=false;});
    }
    // Chỉ route audio khi AudioContext đang chạy và file cùng origin.
    // Nếu graph lỗi, tạo lại thẻ audio thường để không làm mất tiếng nền.
    function restoreNative(reason) {
        if (liveDisabled) return;
        console.warn('[Beat] chuyển sang phân tích MP3 độc lập:',reason);
        liveDisabled=true; clearTimeout(graphWatch); graphWatch=0;
        if(source) {
            const old=audio, at=old.currentTime, resume=!old.paused;
            old.pause();
            try{source.disconnect();}catch(_){} try{analyser.disconnect();}catch(_){}
            source=analyser=null;
            const fresh=old.cloneNode(false); fresh.removeAttribute('src');
            old.replaceWith(fresh); audio=fresh; playPending=false;
            fresh.addEventListener('loadedmetadata',()=>{
                if(Number.isFinite(at) && at>0)try{fresh.currentTime=at;}catch(_){}
                if(resume)tryMusic();
            },{once:true});
            configureAudio(fresh);
            if(resume)tryMusic();
        }
        prepareAnalysis();
    }
    function attachLive() {
        if(liveDisabled || source || !context || context.state!=='running')return;

                item.sprite.position.set(
                    Math.cos(angle) * item.radius,
                    Math.sin(t * 0.75 + item.phase) * birthdayConfig.floatHeight + 0.32 * Math.sin(item.phase * 2),
                    -Math.sin(angle) * item.radius
                );
                birthdayWorldPosition.copy(item.sprite.position).applyMatrix4(birthdayOrbit.matrixWorld);
                const distance = birthdayWorldPosition.distanceTo(birthdayCameraPosition);
                const size = Math.min(1.12, Math.max(0.20, distance / 17));
                item.sprite.scale.set(item.width * size, item.height * size, 1);
                const fade = THREE.MathUtils.smoothstep(distance, 1.5, 5.5);
                const side = birthdayWorldPosition.dot(cameraDirection) / item.radius;
                const depthFade = 0.20 + 0.80 * THREE.MathUtils.smoothstep(side, -0.48, 0.45);
                item.sprite.material.opacity = fade * depthFade * (0.94 + Math.sin(t * 0.7 + item.phase) * 0.06);
                // Dịch theo trục dọc của camera để trái tim luôn nằm dưới ảnh trên màn hình.
                const heart=item.sprite.userData.heart;
                if (heart) {
                    const pulseScale=reduceMotion.matches?1:1+0.18*beatState.pulse+0.08*beatState.bass;
                    const hw=beatConfig.heartWidth*size*pulseScale, hh=beatConfig.heartHeight*size*pulseScale;
                    heart.scale.set(hw,hh,1);
                    heart.position.copy(birthdayWorldPosition).addScaledVector(cameraUp,-(item.height*size*0.45+hh*0.43+beatConfig.heartGap*size));
                    heart.material.opacity=item.sprite.material.opacity;
                    heart.visible=heart.material.opacity>0.01 && cameraForward.dot(heartViewOffset.copy(heart.position).sub(birthdayCameraPosition))>camera.near;
                }
            }
        }
        updateBirthdayOrbit(0);
        // ==================== HẾT PHẦN BỔ SUNG ====================

        const data = atob(datacenter.join(''));
        let clock = new THREE.Clock();
        console.log(data);
        renderer.domElement.addEventListener('webglcontextlost', (event) => {
            event.preventDefault();
            showError(new Error('WebGL bị gián đoạn. Hãy tải lại trang.'));
        });
        // Render khung đầu tiên trước khi ẩn thông báo tải.
        function renderFrame() {
            controls.update();
            const now=performance.now();
            readMusic(now);
            drawHeartWave(now);
            const intensity=reduceMotion.matches ? 0.25 : beatConfig.particleIntensity;
            gu.bass.value=clamp01(beatState.bass*intensity);
            gu.treble.value=clamp01(beatState.treble*intensity);
            const testAge=450-(testPulseUntil-now);
            const testPulse=now<testPulseUntil ? ease01(testAge/75)*(1-ease01((testAge-120)/330)) : 0;
            // Reduced motion: phản ứng nhẹ bằng bass được làm mượt, không chớp mạnh.
            gu.beat.value=reduceMotion.matches ? 0.12*beatState.bass : Math.max(testPulse,clamp01(beatState.pulse*intensity*.75));
            lastRenderPulse=gu.beat.value;
            gu.rippleRadii.value.fromArray(rippleRadii);
            const waveGain=reduceMotion.matches?0:Math.min(1.2,beatConfig.particleIntensity*.70);
            gu.ripplePowers.value.fromArray(ripplePowers).multiplyScalar(waveGain);
            gu.flow.value=reduceMotion.matches?0:clamp01(beatState.flow*beatConfig.flowIntensity);
            gu.flowPhase.value=beatState.phase;
            let t = clock.getElapsedTime() * 0.5;
            gu.time.value = t * Math.PI;
            p.rotation.y = t * 0.05;
            halo.material.opacity = Math.min(1, .83 + .08 * Math.sin(t * .4) + .10*gu.beat.value + .06*gu.bass.value);
            outerHalo.material.opacity = Math.min(1, .49 + .06 * Math.cos(t * .35) + .10*gu.flow.value + .05*gu.beat.value);
            updateBirthdayOrbit(t * 2);
            renderer.render(scene, camera);
        }
        renderFrame();
        bootStatus.hidden = true;
        document.body.classList.add("ready");
        renderer.setAnimationLoop(() => {
            try { renderFrame(); }
            catch (error) { renderer.setAnimationLoop(null); showError(error); }
        });
    }
    Promise.all([loadThree(), document.fonts ? document.fonts.ready : Promise.resolve()])
        .then(([THREE]) => startUniverse(THREE)).catch(showError);
    </script>
</body>
